[package]
name = "protgraph-input-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Builds truncated UniProt flat files as input for ProtGraph"
license = "MIT"
repository = "https://github.com/Sengenhoff-tim/protgraph-input-builder"

[dependencies]
# CLI and errors
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }

# HTTP and async
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2.5"

# Parsing and IO
flate2 = "1.1"
quick-xml = "0.37"
serde = { version = "1.0", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
tempfile = "3.27"
tokio = { version = "1.53", features = ["test-util"] }
