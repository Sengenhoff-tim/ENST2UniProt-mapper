# Weekly update PRs for crates and GitHub Actions; CI (ci.yml) checks each one.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Only patch updates are grouped. Minor updates get their own PR each,
      # because for 0.x crates (quick-xml, reqwest, futures, tracing*) a
      # minor bump such as 0.42 -> 0.43 can be breaking.
      cargo-patch:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
